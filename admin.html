<script>
// ============================================================
// هرم الفطير — Data layer (مشترك بين صفحة المنيو ولوحة التحكم)
// القراءة: مباشرة من جوجل شيت (gviz CSV) — سريعة ومن غير Apps Script.
// لو فشلت لأي سبب، بنجرب Apps Script كبديل.
// الكتابة: Apps Script فقط.
// ============================================================

function hfParseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
      } else field += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); field = ""; rows.push(row); row = []; }
    else if (ch !== "\r") field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => c !== ""));
}

async function hfFetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${HARAM_CONFIG.sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`تعذر قراءة شيت ${sheetName} (HTTP ${res.status})`);
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("الشيت مش متشارك للعرض (Anyone with the link)");
  const rows = hfParseCsv(text);
  if (!rows.length) return [];
  const headers = rows[0].map((h) => h.trim());
  return rows.slice(1).map((r) => {
    const o = {};
    headers.forEach((h, i) => { o[h] = r[i] !== undefined ? r[i] : ""; });
    return o;
  });
}

function hfToBool(v) {
  const s = String(v).trim().toUpperCase();
  return s === "TRUE" || s === "1" || s === "YES" || s === "نعم";
}
function hfToNumber(v) {
  const s = String(v == null ? "" : v)
    .replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[^\d.\-]/g, "");
  return s === "" ? NaN : parseFloat(s);
}
// "M:100 | L:120"  أو  "100"  →  [{label, price}]
function hfParseSizes(t) {
  if (Array.isArray(t)) return t;
  return String(t || "").split("|").map((part) => {
    part = part.trim();
    if (!part) return null;
    const idx = part.lastIndexOf(":");
    const label = idx > -1 ? part.slice(0, idx).trim() : "";
    const price = hfToNumber(idx > -1 ? part.slice(idx + 1) : part);
    return isNaN(price) ? null : { label, price };
  }).filter(Boolean);
}

function hfNormalize(raw) {
  const categories = (raw.categories || []).map((c) => ({
    id: String(c.id || ""), name: String(c.name || ""), icon: String(c.icon || ""),
    bannerImage: String(c.bannerImage || ""), order: Number(c.order) || 0,
    active: typeof c.active === "boolean" ? c.active : hfToBool(c.active),
  })).filter((c) => c.id && c.name).sort((a, b) => a.order - b.order);

  const items = (raw.items || []).map((it) => ({
    id: String(it.id || ""), categoryId: String(it.categoryId || ""), name: String(it.name || ""),
    description: String(it.description || ""), sizes: hfParseSizes(it.sizes), image: String(it.image || ""),
    available: typeof it.available === "boolean" ? it.available : hfToBool(it.available),
    order: Number(it.order) || 0,
  })).filter((it) => it.id && it.name).sort((a, b) => a.order - b.order);

  let settings = raw.settings || {};
  if (Array.isArray(settings)) {
    const s = {};
    settings.forEach((r) => { if (r.key) s[String(r.key)] = r.value == null ? "" : String(r.value); });
    settings = s;
  }
  return { categories, items, settings };
}

const HFData = {
  async bootstrap() {
    try {
      const [categories, items, settings] = await Promise.all([
        hfFetchSheet("Categories"), hfFetchSheet("Items"), hfFetchSheet("Settings"),
      ]);
      return hfNormalize({ categories, items, settings });
    } catch (err) {
      console.warn("gviz فشل، بنجرب Apps Script:", err);
      const res = await fetch(`${HARAM_CONFIG.apiUrl}?action=bootstrap`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "تعذر تحميل المنيو");
      return hfNormalize(json.data);
    }
  },

  // لوحة التحكم: بتقرا من Apps Script مباشرة (أحدث نسخة من الشيت بالظبط)،
  // ولو فشل بترجع للقراءة العادية
  async bootstrapFromApi() {
    try {
      const res = await fetch(`${HARAM_CONFIG.apiUrl}?action=bootstrap&_=${Date.now()}`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "bootstrap failed");
      return Object.assign(hfNormalize(json.data), { apiVersion: Number(json.data.apiVersion) || 1, source: "api" });
    } catch (err) {
      console.warn("Apps Script bootstrap فشل، بنقرا من الشيت:", err);
      return HFData.bootstrap();
    }
  },

  // تسجيل الطلب في شيت Orders — sendBeacon عشان يوصل حتى لو الصفحة راحت للواتساب
  logOrder(order) {
    try {
      const body = JSON.stringify({ action: "addOrder", order });
      if (navigator.sendBeacon && navigator.sendBeacon(HARAM_CONFIG.apiUrl, new Blob([body], { type: "text/plain;charset=utf-8" }))) return;
      fetch(HARAM_CONFIG.apiUrl, { method: "POST", body, keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" } }).catch(() => {});
    } catch (e) { /* تسجيل الطلب اختياري — الواتساب هو الأساس */ }
  },
};

// بيصغّر الصورة قبل الرفع (أسرع وأخف على الشبكة والدرايف)
function resizeImageToBase64(file, maxDim, quality) {
  maxDim = maxDim || 1400;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error("الملف مش صورة صالحة"));
      img.onload = () => {
        let w = img.width,
          h = img.height;
        if (w > maxDim || h > maxDim) {
          const s = maxDim / Math.max(w, h);
          w = Math.round(w * s);
          h = Math.round(h * s);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h); // PNG شفاف → خلفية بيضا
        ctx.drawImage(img, 0, 0, w, h);
        resolve({
          base64: canvas.toDataURL("image/jpeg", quality).split(",")[1],
          mimeType: "image/jpeg"
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
